  - _id: BRjpage000000001
    name: Introduction
    type: text
    title:
      show: true
      level: 1
    text:
      format: 1
      markdown: ''
      content: |
        <h2>Introduction</h2>
        <p>This game is inspired by the 2000 Japanese cult classic of the same name (バトル ロワイヤル). In that story, high school students became rebellious, and the government enacted a law to select a class and force them to fight to the death until only one winner remained. Many spin-offs and variations of this concept have emerged since.</p>
        <p>This game is designed for solo play. You are the overseer, a spectator watching this morbid game unfold. You start with a group of unknown participants, and after each round, you learn more about the survivors. Like many solo RPGs, this game tells a story, but it focuses more on gameplay than journaling. Players are encouraged not to add much journaling beyond the game's rules, as most participants will not last long...</p>
        <p>This game has no specific age range or theme. Do not feel the need to use students; participants can be anyone, with any theme or no theme at all. The core premise is that a group of people wake up, are given the rules of a horrifying and deadly game, and must start immediately.</p>
        <h2>Requirements</h2>
        <ul>
          <li>This document</li>
          <li>Dice (2d6, 2d10, 1d20)</li>
          <li>Deck of cards</li>
          <li>Map with Grid lines (Provided)</li>
          <li>Player roster sheet (Provided)</li>
        </ul>
        <h2>Player Count</h2>
        <p>Figure out how many players you want to enter the arena. The roster supports a full deck of cards (52), but that is a large number of participants. If you play a Roll Call scenario (see "Waking Up"), playing with 52 players will take a significant amount of time. However, if you have the time, feel free to play with a full deck. Here are some starting roster recommendations:</p>
        <ul>
          <li><strong>Random 12</strong> (Approximately 10 minutes for setup) — Deal out one card at a time and roll up each character for up to 12 cards. Once you have dealt 12 cards, put the rest in the box. These will be your starting players. Gender can be represented by even/odd numbers or red/black suits.</li>
          <li><strong>Face Cards Only</strong> (Approximately 10 minutes for setup) — Pull out all face cards, including the Ace. Only fill in the roster for these face cards; put the rest back in the box.</li>
          <li><strong>Full Deck</strong> (Approximately 1 hour for setup) — Use all 52 cards. Roll up attributes for every card on the roster. This takes the longest to play out but results in a very high kill count.</li>
        </ul>
        <h2>Player Roster</h2>
        <p>While many players start, their numbers typically diminish quickly. For this reason, we don't spend much time on initial character development. Instead, we quickly roll up base attributes for all characters at once. Charts in the back of this book can assist with character names, though names can be a challenge even with a name generator.</p>
        <p><em>NOTE: Names are determined by Race/Region. These tables are not intended to cover all terms regarding race or region, but rather to provide a quick visual of what a player may look like, often utilizing your own internal biases and stereotypes. After playtesting, we found this to be the quickest and best method for creating a visual for the game's characters. Personality guides their actions. If you are uncomfortable with rolling for race/region or even name, you can simply refer to participants by the card drawn (e.g., Ace of Hearts) instead of a name.</em></p>
        <p>Review the list below to determine which attributes you will roll for each player.</p>
        <ul>
          <li><strong>Gender</strong> — Recommended: Decide whether to use odd/even numbers or suit colors (red/black) to determine gender.</li>
          <li><strong>Primary personality (1d20)</strong> — Roll 1d20 on the Personality Table. Record the personality or its corresponding number on the roster.</li>
          <li><strong>Region (Race) (1d10 + 1d6)</strong> — On the top of the roster, determine the event's setting and write its primary region/race (e.g., Japanese). Then, select a diversity level, where 1 represents very diverse and 10 represents very homogeneous. The chosen region/race and diversity level will influence character names and add visual context to gameplay.</li>
        </ul>
        <table>
          <thead><tr><th>1d6</th><th>General Region/Race</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>White / European</td></tr>
            <tr><td>2</td><td>Black / African</td></tr>
            <tr><td>3</td><td>Asian</td></tr>
            <tr><td>4</td><td>Hispanic / Latino</td></tr>
            <tr><td>5</td><td>Hawaiian / American Indian</td></tr>
            <tr><td>6</td><td>Middle Eastern / India</td></tr>
          </tbody>
        </table>
        <ul>
          <li><strong>Age (Optional) (1d12)</strong> — If your battle royale is a mixed bag, then also roll a 1d12 on the age chart below:</li>
        </ul>
        <table>
          <thead><tr><th>1d12</th><th>Result</th></tr></thead>
          <tbody>
            <tr><td>1-6</td><td><strong>Young Adult</strong> 20-39</td></tr>
            <tr><td>7-9</td><td><strong>Middle Aged</strong> 40-59</td></tr>
            <tr><td>10</td><td><strong>Teenager</strong> 13-19</td></tr>
            <tr><td>11</td><td><strong>Child</strong> 4-12</td></tr>
            <tr><td>12</td><td><strong>Elderly</strong> 60+</td></tr>
          </tbody>
        </table>
        <ul>
          <li><strong>Name</strong> (Stick to just first names - 2d10) — Because there are often so many players, it's best to use a random name generator; you can find several online. If you roll the same name, add a last name for the duplicate player.</li>
        </ul>
        <h2>Roster Rolls</h2>
        <p>Recommended dice rolls per player:</p>
        <ul>
          <li>1d10 Diversity Dice</li>
          <li>1d20 Personality Dice</li>
          <li>2d10 Name Dice — If the diversity dice roll equals or exceeds the diversity level, roll a 1d6 to determine a new region/race. Use the region/race name table for the player's name. If you roll the same region/race as the default region, pick another nearby region/race. Example: If the default region is Japanese and you roll Asian, pick something like Korean or Chinese for the name.</li>
        </ul>
        <p>Each person will also receive a backpack item, which will be rolled for once they wake up. The chosen scenario explains when they acquire their backpack.</p>
        <h2>Finalizing the Roster</h2>
        <h3>Resolving In Love</h3>
        <p>Once all participants have been rolled up, resolve any players whose personality is In Love. How you resolve this is largely up to you. If two players are In Love, you can pair them. You can gather the cards for all In Love players, shuffle them, and pair them up, or select random cards from the available roster to form pairs. One-sided loves or love triangles are all perfectly legal outcomes.</p>
        <h3>Optimizing Dice Pools</h3>
        <p>At this point, you no longer need the initial dice pool. You will primarily use only 2d6 for the remainder of play. Keep 2d10 for the @UUID[Compendium.battle-royale.items]{Items Table}, but set them aside until needed. All other dice can be returned to the bag.</p>
        <h3>Setting Up Initial Piles</h3>
        <p>Take all cards used to create the Roster and place them in the "Inactive" pile. Any remaining cards can be returned to the card box. You will typically have only three decks in play: Draw, Acted, and Deceased. When playing the Roll Call scenario, first pull cards from the "Inactive" pile and place them on top of the "Draw" pile until all players have been announced. For all other scenarios (see "Waking Up" below), shuffle the cards and place them directly into the "Draw" pile, as all participants will start as Active in Round 1.</p>
        <h2>Waking Up</h2>
        <p>All the "contestants" have been drugged. They wake up groggy and confused. Look at the chart below and pick a scenario that you find most interesting or roll for a random scenario. These scenarios determine the starting location of the players.</p>
        <table>
          <thead><tr><th>Roll</th><th>Location</th><th>Dispersal Method</th><th>Description</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>Abandoned Room</td><td>Roll Call</td><td>They wake up, surrounded by armed guards. A projection flickers alive which tells them the rules. One by one a name is called and a soldier tosses them a backpack and they must leave immediately.</td></tr>
            <tr><td>2</td><td>Scattered</td><td>Dispersed</td><td>People wake up scattered through land and buildings. Confused, they find a backpack with instructions inside. A siren can be heard alerting the players to the game starting immediately.</td></tr>
            <tr><td>3</td><td>Air Drop</td><td>Dispersed</td><td>They wake up on a plane. A commander announces the rules and one by one grabs a person, hands them a backpack and tosses them out the open door.</td></tr>
            <tr><td>4</td><td>The Platform</td><td>Centralized</td><td>They wake to the rush of wind as they are all on a platform rising from the ground. The sky can be seen above them. An announcement alerts them to the game starting. As they reach the top they can see scattered bags in a circle around them. A siren blares and the game starts.</td></tr>
            <tr><td>5</td><td>Prison</td><td>Roll Call</td><td>Each person awakes in their own small cell with a metal door and no windows. An intercom crackles to life and explains the rules. One by one a cell door opens at random and as the person leaves a backpack drops from a chute.</td></tr>
            <tr><td>6</td><td>Stadium</td><td>Centralized</td><td>A giant metal door clangs open to reveal a brightly lit stadium. The stands are replaced by giant screens showing cheering crowds. In front of them are burned out cars and barrels with a pile of backpacks. A large exit gate is on the other side. A buzzer sounds and everyone runs towards the backpacks.</td></tr>
          </tbody>
        </table>
        <p>All players wear a metal collar around their neck, equipped with a small explosive. This explosive will detonate, killing them, if they violate any rules or if the overseers choose to activate it. Any attempt to remove the device will also cause it to explode. Contestants are watched and tracked at all times.</p>
        <p>The Dispersal Method determines the initial placement of the players.</p>
        <ul>
          <li><strong>Roll Call</strong> — Players begin at a single, predetermined location on the map. Choose this location randomly or select it. Select a playing card for each participant as they are released. You will play a round for the active players each time one is released, but the map's round counter does not increment until all participants have been released. For example, after a participant is released, you play all active participants, including the newly released one. Once a round is completed, shuffle them back into the Draw deck and release another participant. Only after all participants have been moved to the Draw deck do the map rounds begin to increment.</li>
          <li><strong>Centralized</strong> — Players begin at a single, predetermined location on the map. Choose this location randomly or select it. All participants start simultaneously in this scenario. All participants are shuffled and placed directly into the Draw deck.</li>
          <li><strong>Dispersed</strong> — For each participant, you will roll randomly to determine their starting location on the map. If a roll would place a participant in a lethal location (e.g., the ocean), you may consider them dead. Alternatively, if that seems unfair, you can re-roll or place them in the nearest safe location. After placing a participant, roll for their starting backpack item from the @UUID[Compendium.battle-royale.items]{Items Table}.</li>
        </ul>
        <p>When a participant acquires their backpack, roll for their item on the @UUID[Compendium.battle-royale.items]{Items Table}.</p>
    sort: 100000
    flags: {}
