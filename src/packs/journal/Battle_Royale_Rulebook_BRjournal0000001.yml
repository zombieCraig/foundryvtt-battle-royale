        <h2>Combat</h2>
        <p>Combat functions similarly to other actions. Once a target has been identified (see <em>Playing the Game</em>), both participants roll, adding any item modifications to their respective rolls. Note that there is only an 'Attack' action and no 'Defend' action; this is because a defender, once attacked, retaliates with the same lethal intent as the original attacker.</p>
        <p>The participant with the highest roll (after modifications) wins the combat. If a participant does not have a weapon, their attack suffers a -1 penalty. Any item that could reasonably cause harm in a fight is considered a weapon and negates this -1 unarmed penalty. Items that grant an 'Attack +X' bonus are always considered weapons. The loser's fate must then be determined. Roll on the table below to ascertain the extent of the damage. In the event of a tie, no one is hurt.</p>
        <table>
          <thead><tr><th>1d6</th><th>Damage Result</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>The victim was injured but it could have been worse. Roll on the Injury Table with a -2</td></tr>
            <tr><td>2</td><td>The victim was injured. Roll on the Injury Table</td></tr>
            <tr><td>3</td><td>The victim barely survived the assault. Roll on the Injury Table with a +2</td></tr>
            <tr><td>4-6</td><td>The victim is murdered. Cross them off the roster.</td></tr>
          </tbody>
        </table>
        <p><strong>Teammate Assistance:</strong> When a player is in combat (attacking or defending), each alive teammate in the same cell provides a +1 bonus to both their attack and defense rolls, up to a maximum of +2.</p>
        <blockquote><p>Example: Player A attacks Player B. Player A has one teammate in the same cell, gaining +1 to attack. Player B has two teammates in the same cell, gaining +2 to defense.</p></blockquote>
        <p>When a person is killed, the killer may choose to loot the body and exchange inventory items. This is decided by the Overseer. If it makes sense for the killer, the Overseer moves the inventory to the killer's possession; otherwise, the item is considered lost and cannot be retrieved. The Overseer should consider the player's personality; for example, an Aggressive person might always take the stronger weapon, while a Humanitarian might exchange it for a first aid kit.</p>
        <h3>Multi-Attack</h3>
        <p>Some weapons have a multi-attack attribute. A weapon with a multi-attack attribute allows the wielder to hit up to 3 people in the same area. This is an aimed attack and will not hit allies. The attacker must still determine the main target, as only that target's roll can harm the attacker.</p>
        <p>Resolve the attack against the first target before the other two. If the first target defeats the attacker, the other two targets do not need to make rolls, as the attacker is already defeated. If the first target fails, however, the other two can only attempt to dodge the attack and will not be able to harm the attacker.</p>
        <h3>Area Affect</h3>
        <p>When a player carrying an Area Affect item rolls to attack, they will use it if there are other players in the same space. If not, treat it as a move instead. For an Area Affect attack, the attacker rolls one 6-sided die. This roll determines the number others must match or exceed to evade the attack. Thus, an attacker's roll of 1 is a dud and affects no one in the space.</p>
        <p>If the effect of an Area Affect is a modifier (such as -2), it will only last for the target's next turn. If it results in an injury, that injury can, of course, have long-lasting effects, including death.</p>
        <h3>Desperation</h3>
        <p>As the game progresses, the overseers increase the stakes and combat becomes more lethal in later rounds.</p>
        <ul>
          <li>Rounds 1–15: Normal rules. Damage roll of 4+ on d6 = death.</li>
          <li>Rounds 16–20: Damage rolls get +1. Injuries are more likely to be fatal.</li>
          <li>Rounds 21–25: Damage rolls get +2. Action success threshold drops to 3+ (usually 4+). Nearly all injuries are fatal.</li>
          <li>Rounds 26+: Damage rolls get +3. All damage is lethal. Any hit kills.</li>
        </ul>
        <h3>Overseer's Decree - Showdown</h3>
        <p>When the number of living players drops to 5 or fewer, the Overseers declare a Showdown:</p>
        <ol>
          <li><strong>Zone Freeze:</strong> Zone progression halts. No more zones advance to Warning or Lethal.</li>
          <li><strong>Forced Combat:</strong> All non-combat actions (Move, Hide, Search, Comfort) are replaced with Attack. Players must fight.</li>
          <li><strong>Desperation Plea:</strong> Convince actions become a Desperation Plea — a lethal social attack. Roll opposed; if the Convince player wins, the target dies (instead of joining their team).</li>
          <li><strong>Collar Failsafe:</strong> If an entire round passes with zero deaths during the Showdown, the Overseers detonate one random player's collar at end of round.</li>
          <li><strong>Final Scenario at 2:</strong> When exactly 2 players remain during a Showdown, the Final Scenario triggers immediately regardless of team membership.</li>
        </ol>
        <h3>Overseer's Impatience</h3>
        <p>After 2 deathless rounds following the decree (5 or fewer players), the Overseer becomes impatient. They will issue a warning to the players and starting the following round, a random player's collar will explode.</p>
        <table>
          <thead><tr><th>Consecutive Deathless Rounds</th><th>Response</th></tr></thead>
          <tbody>
            <tr><td>≤2</td><td>Nothing</td></tr>
            <tr><td>3</td><td>Warning to the players</td></tr>
            <tr><td>4+</td><td>Collar Detonation: A player is selected at random and their head explodes.</td></tr>
          </tbody>
        </table>
        <p>The counter resets to 0 whenever any death occurs (combat, zone, hazard, or collar). When Showdown has initiated, the overseer will no longer initiate a countdown and will allow the showdown to conclude on its own.</p>
        <h3>Injury Table</h3>
        <table>
          <thead><tr><th>1d10</th><th>Injury</th><th>Affect</th></tr></thead>
          <tbody>
            <tr><td>&lt;1</td><td>Flesh Wound</td><td>None</td></tr>
            <tr><td>1</td><td>Sprained Ankle</td><td>Move -1</td></tr>
            <tr><td>2</td><td>Head Injury</td><td>Hide -1, Search -1</td></tr>
            <tr><td>3</td><td>Bloodied Arm</td><td>Attack -1</td></tr>
            <tr><td>4</td><td>Mangled Calf</td><td>Move -2</td></tr>
            <tr><td>5</td><td>Severed Finger</td><td>Attack -1</td></tr>
            <tr><td>6</td><td>Damaged Eye</td><td>Search -2</td></tr>
            <tr><td>7</td><td>Burned</td><td>Hide -2, Attack -1</td></tr>
            <tr><td>8</td><td>Broken Bone</td><td>Attack -2</td></tr>
            <tr><td>9</td><td>Severed Limb</td><td>Attack -3, Move -2</td></tr>
            <tr><td>10</td><td>Bleeding Out</td><td>Attack -3, Move -4</td></tr>
            <tr><td>&gt;10</td><td>Dismembered</td><td>Dead</td></tr>
          </tbody>
        </table>
        <h3>Death</h3>
        <p>When someone is killed, cross them off the roster and add a kill tick to the murderer. The next time their card is drawn, place it in the deceased pile, and their name is announced as dead to the rest of the survivors.</p>
